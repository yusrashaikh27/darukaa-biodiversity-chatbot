name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darukaa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://darukaa:darukaa@localhost:5432/darukaa
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Init DB schema
        run: python -m app.db.init_db

      - name: Run tests
        run: pytest -v
